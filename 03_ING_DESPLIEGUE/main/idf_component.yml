# ─────────────────────────────────────────────────────────────────────────────
# TFM TinyML Detector — Dependencias de componentes ESP-IDF
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  # Driver de cámara OV5640
  espressif/esp32-camera:
    version: "^2.0.0"

  # TFLite Micro para ESP-IDF (runtime TFLite)
  espressif/esp-tflite-micro:
    version: "^1.3.0"

  # ESP-DL: framework de inferencia nativo Espressif (runtime ESPDL)
  espressif/esp-dl:
    version: "^3.2.0"

  # cJSON para serialización JSON (WebSocket)
  # (built-in en ESP-IDF, pero declaramos para claridad)
  idf:
    version: ">=5.3.0"
