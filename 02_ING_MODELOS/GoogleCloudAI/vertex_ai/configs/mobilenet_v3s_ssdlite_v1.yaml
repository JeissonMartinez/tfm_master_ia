# ─────────────────────────────────────────────────────────────
# Configuración: MobileNetV3-Small + SSD-Lite — v1 (Baseline)
# ─────────────────────────────────────────────────────────────
# Este YAML define todos los hiperparámetros para un Custom Job
# de Vertex AI. Es leído por trainer/config_loader.py y convertido
# en un ExperimentSetup compatible con src_colab.

model:
  family: MobileNetV3
  variant: MobileNetV3S_SSDLite
  version: v1
  description: "Baseline MobileNetV3-Small SSD-Lite para detección en ESP32-S3"

dataset:
  name: tfrecord
  gcs_uri: gs://project-18f58341-12cf-47bc-861-tfm-data/datasets/tfrecord
  class_names: [dog, door, obstacle, person, stair]
  img_size: 224

common:
  batch_size: 32
  patience: 15
  seed: 42
  conf_threshold: 0.25
  iou_threshold: 0.45

mobilenet:
  # Phase 1 — backbone congelado
  phase1_epochs: 10 # 30
  phase1_lr: 0.001

  # Phase 2 — fine-tuning parcial
  phase2_epochs: 10 # 50
  phase2_lr: 0.00005
  phase2_unfreeze_layers: 40

  # Augmentación
  augmentation_level: medium

  # Arquitectura
  backbone_alpha: 1.0
  minimalistic: true
  dropout_rate: 0.2
  l2_reg: 0.0001
  feature_channels: 128

  # Anclas SSD
  anchor_sizes: [0.1, 0.2, 0.37, 0.54, 0.71, 0.88]
  anchor_ratios: [1.0, 2.0, 0.5, 3.0, 0.33]

  # Focal Loss
  focal_alpha: 0.25
  focal_gamma: 2.0
  neg_pos_ratio: 3

  # Pesos de clase
  use_class_weights: true
  class_weight_method: effective_samples
