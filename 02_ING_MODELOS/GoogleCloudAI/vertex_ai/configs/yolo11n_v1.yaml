# ─────────────────────────────────────────────────────────────
# Configuración: YOLO11-Nano — v1 (Baseline)
# ─────────────────────────────────────────────────────────────
# Este YAML define todos los hiperparámetros para un Custom Job
# de Vertex AI. Es leído por trainer/config_loader.py y convertido
# en un ExperimentSetup compatible con src_colab.

model:
  family: YOLO11
  variant: yolo11n
  version: v1
  description: "Baseline YOLO11-Nano para detección en ESP32-S3"

dataset:
  name: yolo26
  gcs_uri: gs://project-18f58341-12cf-47bc-861-tfm-data/datasets/yolo26.zip
  class_names: [dog, door, obstacle, person, stair]
  img_size: 224

common:
  batch_size: 32
  patience: 30
  seed: 42
  conf_threshold: 0.25
  iou_threshold: 0.45

yolo:
  epochs: 30
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  cos_lr: true
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Augmentación
  mosaic: 1.0
  mixup: 0.1
  close_mosaic: 10
  copy_paste: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  erasing: 0.0

  # Loss weights
  box: 7.5
  cls: 0.5

  # Otros
  freeze: null
  amp: true
  workers: 4
  max_det: 300
