# ─────────────────────────────────────────────────────────────
# Configuración: FCOS — MobileNetV3-Small + FPN — v1 (Baseline)
# ─────────────────────────────────────────────────────────────
# Custom Job de Vertex AI · Ciclo 2
# Leído por trainer/config_loader.py → ExperimentSetup

model:
  family: FCOS
  variant: fcos_v3s
  version: v1
  description: "FCOS con MobileNetV3-Small backbone + SimpleFPN + FCOS head"

dataset:
  name: iodc_yolo
  gcs_uri: gs://project-18f58341-12cf-47bc-861-tfm-data/datasets/iodc_yolo.zip
  class_names: [dog, door, obstacle, person, stair]
  img_size: 224

common:
  batch_size: 16
  patience: 20
  seed: 42
  conf_threshold: 0.25
  iou_threshold: 0.45

fcos:
  # ── Arquitectura ──────────────────────────────────────────
  backbone: mobilenet_v3_small
  pretrained_backbone: true
  fpn_channels: 64
  strides: [8, 16, 32]
  num_head_convs: 2

  # ── Fase 1 — Backbone congelado ──────────────────────────
  phase1_epochs: 30
  phase1_lr: 1.0e-3
  phase1_wd: 1.0e-4
  phase1_optimizer: adamw
  phase1_scheduler: cosine

  # ── Fase 2 — Todo descongelado ───────────────────────────
  phase2_epochs: 80
  phase2_lr: 1.0e-4
  phase2_wd: 1.0e-5
  phase2_optimizer: adamw
  phase2_scheduler: cosine

  # ── Redimensionado progresivo ─────────────────────────────
  resize_schedule:
    0: 640
    10: 416
    20: 320
    30: 224

  # ── Loss weights ──────────────────────────────────────────
  cls_weight: 1.0
  reg_weight: 1.5
  centerness_weight: 1.0

  # ── Augmentation (Albumentations) ─────────────────────────
  aug_horizontal_flip: 0.5
  aug_brightness_contrast: 0.3
  aug_gaussian_noise: 0.2
  aug_rotation_limit: 15
  aug_hue_sat_val: true

  # ── Entrenamiento ─────────────────────────────────────────
  amp: true
  grad_clip: 10.0
  workers: 4

  # ── Export ────────────────────────────────────────────────
  export_imgsz: 224
  export_opset: 13
