# ─────────────────────────────────────────────────────────────
# Configuración: ESPDet-Pico — v2 (Official Espressif Architecture)
# ─────────────────────────────────────────────────────────────
# Custom Job de Vertex AI · Ciclo 2
# Leído por trainer/config_loader.py → ExperimentSetup
#
# ESPDet-Pico v2: Arquitectura oficial Espressif (0.36M params)
# con transfer learning desde pesos cat-detection de esp-detection.
#
# Cambios vs v1:
#   - Arquitectura oficial (DSConv, DSC3k2, ESPBlock, ESPDetectHead)
#   - Strides [8, 16, 32] (oficial) en vez de [4, 8, 16]
#   - Transfer learning con espdet_pico_224_224_cat.pt (~99.97% params)
#   - Entrenamiento 50+100=150 ep (vs 40+80=120 ep)
#   - Resolución fija 224×224 (sin progressive resize)
#   - Paciencia 25 (vs 20)

model:
  family: ESPDet
  variant: espdet_pico
  version: v2
  description: "ESPDet-Pico oficial Espressif + transfer learning cat-detection"

dataset:
  name: iodc_yolo
  gcs_uri: gs://project-18f58341-12cf-47bc-861-tfm-data/datasets/iodc_yolo.zip
  class_names: [dog, door, obstacle, person, stair]
  img_size: 224

common:
  batch_size: 32
  patience: 25
  seed: 42
  conf_threshold: 0.25
  iou_threshold: 0.45

espdet:
  # ── Arquitectura oficial ──────────────────────────────────
  # NOTE: width_mult y reg_max ya no se usan — la arquitectura
  #       oficial usa scale 'n'=[0.50, 0.25, 512] fija.
  strides: [8, 16, 32]
  pretrained_weights: gs://project-18f58341-12cf-47bc-861-tfm-data/pretrained/espdet_pico_224_224_cat.pt

  # ── Fase 1 — Backbone congelado (layers 0-10) ────────────
  # Transfer learning: ~99.97% params loaded, solo cls final
  # layers (nc=1→5) se inicializan random → warm-up necesario.
  phase1_epochs: 50
  phase1_lr: 1.0e-3
  phase1_wd: 1.0e-4
  phase1_optimizer: adamw
  phase1_scheduler: cosine

  # ── Fase 2 — Todo descongelado ───────────────────────────
  phase2_epochs: 100
  phase2_lr: 1.0e-4
  phase2_wd: 1.0e-5
  phase2_optimizer: adamw
  phase2_scheduler: cosine

  # ── Redimensionado — fijo 224 (match pretrained) ──────────
  resize_schedule:
    0: 224

  # ── Loss weights ──────────────────────────────────────────
  cls_weight: 1.0
  reg_weight: 2.0

  # ── Augmentation (Albumentations — moderado) ──────────────
  # Keys alineados con IODCDataset._build_transforms(): cfg.get("aug_*")
  aug_hflip_prob: 0.5
  aug_brightness_limit: 0.3
  aug_contrast_limit: 0.3
  aug_rotate_limit: 15
  aug_gaussian_noise: 0.2

  # ── Entrenamiento ─────────────────────────────────────────
  amp: true
  grad_clip: 5.0
  workers: 4

  # ── Export ────────────────────────────────────────────────
  export_imgsz: 224
  export_opset: 13
