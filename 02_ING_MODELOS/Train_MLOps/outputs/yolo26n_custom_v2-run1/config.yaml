# ─────────────────────────────────────────────────────────────
# Configuración: YOLO26 Custom — v2 (MuSGD Optimizer)
# ─────────────────────────────────────────────────────────────
# Custom Job de Vertex AI · Ciclo 2 — Train 2
# Basado en v1 (Baseline), con cambios de la PROPUESTA A:
#
# CAMBIOS vs v1:
#   1. optimizer: MuSGD  (era: auto → AdamW)
#      → Optimizer nativo de YOLO26, híbrido SGD+Muon
#      → Ahora los lr0/momentum configurados SÍ se usan
#   2. phase2_lr0: 0.0005 (era: 0.001, pero ignorado)
#      → Más conservador para fine-tuning (lección Train 1)
#   3. phase2_lrf: 0.01  (era: 0.001)
#      → Ajustado para lr0 más bajo (final=0.000005 vs 0.0000005)
#   4. momentum: 0.9     (era: 0.937, pero ignorado)
#      → Standard para MuSGD (usado por auto cuando elige MuSGD)
#   5. warmup_bias_lr: 0.0  (era: 0.1)
#      → CRÍTICO: auto siempre fuerza 0.0 para MuSGD/AdamW.
#        Con 0.1 y lr0=0.01, biases arrancarían 10× sobre target.
#   6. conf_threshold: 0.15 (era: 0.25)
#      → Mejorar recall (0.64 en T1). Más detecciones, menos FN.
#
# El resto de parámetros son idénticos a v1.

model:
  family: YOLO26_CUSTOM
  variant: yolo26n_custom
  version: v2
  description: "YOLO26n 2-fases — MuSGD optimizer (Propuesta A)"

dataset:
  name: iodc_yolo
  gcs_uri: gs://project-18f58341-12cf-47bc-861-tfm-data/datasets/iodc_yolo.zip
  class_names: [dog, door, obstacle, person, stair]
  img_size: 640

common:
  batch_size: 16
  patience: 30
  seed: 42
  conf_threshold: 0.15          # ← CAMBIADO (era 0.25)
  iou_threshold: 0.45

yolo26_custom:
  # ── Modelo base ───────────────────────────────────────────
  pretrained_weights: yolo11n.pt

  # ── Fase 1 — Backbone congelado (Ultralytics) ────────────
  phase1_epochs: 30
  phase1_freeze_layers: 10
  phase1_lr0: 0.01              # Ahora SÍ se usa (MuSGD respeta lr0)
  phase1_lrf: 0.01
  phase1_cos_lr: true

  # ── Fase 2 — Todo descongelado ───────────────────────────
  phase2_epochs: 70
  phase2_freeze_layers: 0
  phase2_lr0: 0.0005            # ← CAMBIADO (era 0.001)
  phase2_lrf: 0.01              # ← CAMBIADO (era 0.001, ajustado a lr0 más bajo)
  phase2_cos_lr: true

  # ── Optimización ──────────────────────────────────────────
  optimizer: MuSGD              # ← CAMBIADO (era auto → AdamW)
  momentum: 0.9                 # ← CAMBIADO (era 0.937)
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.0           # ← CAMBIADO (era 0.1) — crítico para MuSGD

  # ── Augmentación (sin cambios vs v1) ──────────────────────
  mosaic: 1.0
  mixup: 0.1
  close_mosaic: 10
  copy_paste: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  erasing: 0.0

  # ── Loss weights (sin cambios vs v1) ─────────────────────
  box: 7.5
  cls: 0.5

  # ── Otros ─────────────────────────────────────────────────
  amp: true
  workers: 4
  max_det: 300

  # ── Export ────────────────────────────────────────────────
  export_imgsz: 224
  export_opset: 13
